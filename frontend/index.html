<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIITBA Web - Historical Seismograms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/logo.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/panels.css" />
  <link rel="stylesheet" href="/src/styles/modal.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <img src="/logo-unam_lpng.png" alt="UNAM Logo" class="app-logo unam-logo" />
    </div>
    <div class="header-center">
      <div class="title-container">
        <img src="/logo.png" alt="Tiitba Logo" class="app-logo tiitba-logo" />
        <h1>Tiitba-Web <span class="version">V1.0</span></h1>
      </div>
      <p class="subtitle">Historical Seismograms Vectorization, Analysis, and Corrections</p>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="theme-toggle-icon" aria-label="Toggle theme">
        <!-- Sun icon -->
        <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <!-- Moon icon -->
        <svg id="theme-icon-moon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <span id="session-indicator" class="session-badge"></span>
    </div>
  </header>

  <main class="app-layout">
    <!-- Main Side Navigation (Modules) -->
    <nav class="side-nav">
      <div class="nav-brand">
        <img src="/logo.png" alt="Logo" />
        <span>TIITBA</span>
      </div>
      <button class="nav-item active" data-tab="image" title="Image Processing">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <span>Image</span>
      </button>
      <button class="nav-item" data-tab="vectorization" title="Vectorization">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8m0 0V4m0 8h8m-8 0H4"></path></svg>
        <span>Vectorize</span>
      </button>
      <button class="nav-item" data-tab="corrections" title="Corrections & Export">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        <span>Correct</span>
      </button>
      <div class="nav-spacer"></div>
      <button id="btn-session-history" class="nav-item" title="Recent Sessions">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-9-9 9 9 0 0 1 9 9z"></path></svg>
        <span>History</span>
      </button>
    </nav>

    <!-- Control Panels (Second Level Nav / Options) -->
    <aside class="control-panels">
      <!-- Image Processing Panel -->
      <section id="panel-image" class="panel active">
        <div class="panel-header">
          <h2>Image Processing</h2>
        </div>
        <div class="panel-scroll">
          <div class="panel-section">
            <h3>Input</h3>
            <div class="upload-zone" id="image-drop-zone">
              <input type="file" id="image-upload" accept=".jpg,.jpeg,.png,.tif,.tiff" class="hidden" />
              <label for="image-upload" class="upload-label">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span>Upload Seismogram</span>
              </label>
            </div>
            <div class="form-row">
              <label for="ppi-input">PPI:</label>
              <input type="number" id="ppi-input" placeholder="Auto-detect" step="1" />
            </div>
          </div>
          <div class="panel-section">
            <h3>Functions</h3>
            <div class="action-list">
              <button id="btn-rotate" class="action-item" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                Rotate 90&deg;
              </button>
              <button id="btn-contrast" class="action-item" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 18a6 6 0 0 0 0-12v12z"></path></svg>
                Contrast Enhance
              </button>
              <button id="btn-binarize" class="action-item" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                Binarize (Otsu)
              </button>
              <button id="btn-undo-binarize" class="action-item hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                Undo Binarize
              </button>
              <button id="btn-trim-mode" class="action-item" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13V6a2 2 0 0 1 2-2h7"></path><path d="M18 11v7a2 2 0 0 1-2 2H9"></path><polyline points="1 20 23 2"></polyline></svg>
                Trim ROI
              </button>
            </div>
          </div>
          <div id="image-info" class="info-box"></div>
        </div>
      </section>

      <!-- Vectorization Panel -->
      <section id="panel-vectorization" class="panel">
        <div class="panel-header">
          <h2>Vectorization</h2>
        </div>
        <div class="panel-scroll">
          <div class="panel-section">
            <h3>Scale Definition</h3>
            <div class="action-list">
              <button id="btn-set-scale" class="action-item" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="12" x2="22" y2="12"></line><line x1="7" y1="7" x2="7" y2="17"></line><line x1="17" y1="7" x2="17" y2="17"></line></svg>
                Set Scale Method
              </button>
            </div>
            <div id="scale-status" class="status-badge scale-status hidden"></div>
          </div>
          <div class="panel-section">
            <h3>Trace Digitization</h3>
            <div class="action-list">
              <button id="btn-vectorize" class="action-item primary" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8m0 0V4m0 8h8m-8 0H4"></path></svg>
                Start Vectorizing
              </button>
              <button id="btn-clear-points" class="action-item danger" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Clear All Points
              </button>
            </div>
            <div class="status-badge">
              <span id="point-count">0</span> points collected
            </div>
          </div>
          <div class="panel-section">
            <h3>Review & Export</h3>
            <div class="action-list">
              <button id="btn-plot-preview" class="action-item" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M18 9l-5 5-2-2-4 4"></path></svg>
                Plot Preview
              </button>
              <button id="btn-export-ascii" class="action-item" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export ASCII
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Corrections Panel -->
      <section id="panel-corrections" class="panel">
        <div class="panel-header">
          <h2>Corrections</h2>
        </div>
        <div class="panel-scroll">
          <div class="panel-section">
            <h3>Data Source</h3>
            <div class="upload-zone" id="data-drop-zone">
              <input type="file" id="data-upload" accept=".txt,.dat,.asc" class="hidden" />
              <label for="data-upload" class="upload-label">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                <span>Upload External Data</span>
              </label>
            </div>
            <button id="btn-upload-data" class="btn btn-sm hidden">Manual Upload</button>
          </div>
          <div class="panel-section">
            <h3>Process</h3>
            <div class="action-list">
              <button id="btn-polarity" class="action-item" disabled>Invert Polarity</button>
              <button id="btn-detrend" class="action-item" disabled>Detrend...</button>
              <button id="btn-curvature" class="action-item" disabled>Curvature...</button>
              <button id="btn-resample" class="action-item" disabled>Resample...</button>
              <button id="btn-wiechert" class="action-item" disabled>Wiechert Resp...</button>
            </div>
          </div>
          <div class="panel-section">
            <h3>Standard Export</h3>
            <div class="form-group">
              <label>Data:</label>
              <select id="export-data-type" class="form-select">
                <option value="detrend">Detrended</option>
                <option value="curvature_ga">Curvature (G&A94)</option>
                <option value="curvature_ls">Curvature (LS)</option>
                <option value="resampled" selected>Resampled</option>
                <option value="response">Instrument Response</option>
              </select>
            </div>
            <div class="form-group">
              <label>Format:</label>
              <select id="export-format" class="form-select">
                <option value="ascii">ASCII (.txt)</option>
                <option value="sac">SAC (.sac)</option>
                <option value="miniseed">MiniSEED (.mseed)</option>
              </select>
            </div>
            <button id="btn-export-corrected" class="action-item primary" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Download File
            </button>
          </div>
        </div>
      </section>
    </aside>

    <!-- Center: Workspace -->
    <div class="workspace">

      <!-- Workspace Navigation/Tabs -->
      <div class="workspace-tabs" id="workspace-tabs">
        <button class="workspace-tab active" data-target="canvas-view">Image Canvas</button>
        <button class="workspace-tab" data-target="plot-view">Plot Preview</button>
        <span id="workspace-filename" class="workspace-filename"></span>
        <div class="workspace-controls">
          <button id="btn-maximize-canvas" class="btn btn-primary btn-sm">Maximize</button>
        </div>
      </div>

      <!-- Canvas View -->
      <div id="canvas-view" class="workspace-view active">
        <div id="canvas-container" class="canvas-container">
          <canvas id="image-canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
          <div id="canvas-status" class="canvas-status">No image loaded</div>
        </div>
      </div>

      <!-- Plot View -->
      <div id="plot-view" class="workspace-view hidden">
        <div id="plot-container" class="plot-container"></div>
      </div>
    </div>

    <!-- Right: Info Log -->
    <aside class="info-log-panel">
      <h3>Log</h3>
      <div id="info-log" class="info-log"></div>
    </aside>
  </main>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
